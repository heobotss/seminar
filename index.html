<!doctype html>
<html lang="ko">
<head>

<title>4T 트레이너 마케팅 세미나 — 허봇스</title>
<meta name="description" content="4T 트레이너 마케팅 세미나는 지금 모집하지 않습니다.">
<style>
:root{--ink:#0A0A0A;--panel:#111;--line:#2F2F2F;--bone:#F2F2F2;--warm:#BDBDBD;--brass:#4F86F7}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 20px;background:var(--ink);color:var(--bone);
 font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;word-break:keep-all}
main{width:100%;max-width:560px;margin:0 auto}
.k{color:var(--brass);font-size:13px;font-weight:700;letter-spacing:.04em}
h1{margin:10px 0 14px;font-size:clamp(26px,6vw,36px);line-height:1.3;font-weight:800}
p{color:var(--warm);font-size:16px}
.go{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0}
a.btn{display:inline-block;padding:13px 20px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--bone)}
a.btn.solid{background:var(--bone);border-color:var(--bone);color:#000}
.q{padding-top:20px;border-top:1px solid var(--line);font-size:14px}
.q a{color:var(--bone)}
footer{max-width:560px;width:100%;margin:40px auto 0;color:#8E8E8E;font-size:12.5px}
</style>
</head>
<body>
<main>
  <p class="k">4T 트레이너 마케팅 세미나</p>
  <h1>지금은 모집하지 않습니다</h1>
  <p>회원이 오는 길을 먼저 고치고 싶으시면 무료 진단과 온라인 강의부터 시작하실 수 있습니다.</p>
  <div class="go">
    <a class="btn solid" href="https://heobotss.com/#/check">30초 진단 재 보기</a>
    <a class="btn" href="https://heobotss.com/#/vod">온라인 강의 보기</a>
  </div>
  <p class="q">이미 등록하거나 입금하신 분은 <a href="https://www.instagram.com/heobotss/">인스타그램 @heobotss</a> 메시지로 알려 주세요.</p>
</main>
<footer>허봇스 · 대표 허재윤 · 사업자등록번호 636-04-03949 · 010-8245-5022</footer>
